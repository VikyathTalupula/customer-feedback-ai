<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apology Email Drafter</title>
<style>
  :root { --ink:#1b2a33; --muted:#5d6b73; --line:#d5dde1; --bg:#f4f7f8; --accent:#0f6b6b; --err:#a32a2a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:680px; margin:0 auto; padding:40px 20px 64px; }
  h1 { font-size:1.6rem; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  label { display:block; font-weight:600; margin:18px 0 6px; }
  textarea, select { width:100%; padding:12px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; color:inherit; }
  textarea { min-height:150px; resize:vertical; }
  textarea:focus, select:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .count { color:var(--muted); font-size:.85rem; text-align:right; }
  button.go { margin-top:20px; padding:12px 22px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.go:disabled { opacity:.6; cursor:wait; }
  #status { margin-top:16px; color:var(--muted); }
  #status.error { color:var(--err); }
  #result { display:none; margin-top:28px; padding:28px 30px; background:#fff; border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; }
  #email { font:1.05rem/1.7 Georgia, "Times New Roman", serif; white-space:pre-wrap; margin:0; }
  button.copy { margin-top:18px; padding:8px 14px; border:1px solid var(--accent); border-radius:6px; background:#fff; color:var(--accent); font:inherit; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Apology email drafter</h1>
  <p class="sub">Paste a customer review and its star rating. Reviews with 1 or 2 stars get a personalised apology email.</p>

  <label for="review">Customer review</label>
  <textarea id="review" maxlength="1500" placeholder="The zipper broke the first time I wore it and support never replied..."></textarea>
  <div class="count"><span id="n">0</span> / 1500</div>

  <label for="rating">Rating</label>
  <select id="rating">
    <option value="1">1 out of 5</option>
    <option value="2">2 out of 5</option>
    <option value="3">3 out of 5</option>
    <option value="4">4 out of 5</option>
    <option value="5">5 out of 5</option>
  </select>

  <button class="go" id="go">Generate email</button>
  <div id="status" role="status"></div>

  <section id="result">
    <pre id="email"></pre>
    <button class="copy" id="copy">Copy email</button>
  </section>
</main>

<script>
  // After deploying on Render, replace this with your Render URL + /generate
  const API_URL = "https://YOUR-APP-NAME.onrender.com/generate";

  const $ = (id) => document.getElementById(id);
  $("review").addEventListener("input", () => { $("n").textContent = $("review").value.length; });

  $("go").addEventListener("click", async () => {
    const review = $("review").value.trim();
    if (!review) { setStatus("Enter a customer review first.", true); return; }

    $("go").disabled = true;
    $("result").style.display = "none";
    setStatus("Writing the email... the first request can take up to a minute while the server wakes up.");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ review: review, rating: Number($("rating").value) })
      });
      const data = await res.json();
      if (!res.ok) { setStatus(data.error || "Something went wrong. Try again.", true); }
      else if (data.email) { $("email").textContent = data.email; $("result").style.display = "block"; setStatus(""); }
      else { setStatus(data.message); }
    } catch (e) {
      setStatus("Could not reach the server. Check the API_URL in index.html and try again.", true);
    }
    $("go").disabled = false;
  });

  $("copy").addEventListener("click", () => {
    navigator.clipboard.writeText($("email").textContent);
    $("copy").textContent = "Copied";
    setTimeout(() => { $("copy").textContent = "Copy email"; }, 1500);
  });

  function setStatus(text, isError) {
    $("status").textContent = text;
    $("status").className = isError ? "error" : "";
  }
</script>
</body>
</html>
